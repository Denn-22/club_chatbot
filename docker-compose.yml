services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 40s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001" # console web MinIO
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/almanakklub
      OLLAMA_URL: https://ollama.if.unismuh.ac.id/api/generate
      OLLAMA_MODEL: llama3.2
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: club-images
    ports:
      - "4000:4000" # API + Swagger di /docs
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_started

  seed:
    build: ./backend
    command: node dist/seed/seed.js
    environment:
      MONGO_URI: mongodb://mongo:27017/almanakklub
      DATASET_PATH: /data/dataset_club.json
    volumes:
      - ./datasetclub/dataset_club.json:/data/dataset_club.json:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mongo-data:
  minio-data:
